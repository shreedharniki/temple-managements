name: Auto Create PR

on:
  push:
    branches:
      - feature/donation-api-integration-v2

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: Donation API Integration V2
          body: |
            Auto-generated PR from feature branch to main.