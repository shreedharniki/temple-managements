name: Auto Create PR

on:
  push:
    branches:
      - feature/donation-api-integration-v2

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head feature/donation-api-integration-v2 \
            --title "Donation API Integration V2" \
            --body "Automated PR from feature branch" || true